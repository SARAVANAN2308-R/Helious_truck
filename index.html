<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Helious truck</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body,
      html {
        margin: 0;

        padding: 0;

        height: 100%;

        overflow: hidden;

        background: #020508;

        font-family: "Orbitron", sans-serif;

        color: white;
      }
      .background-overlay {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background:
          linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
          url("./images/truck3.jpg");

        background-size: cover;

        background-position: center;

        background-repeat: no-repeat;

        z-index: 0;
      }
      .panel {
        background: linear-gradient(
          135deg,
          rgba(5, 10, 15, 0.82),
          rgba(0, 5, 10, 0.88)
        );

        padding: 25px;

        border-radius: 16px;

        border: 1px solid rgba(212, 175, 55, 0.5);

        box-shadow:
          0 15px 50px rgba(0, 0, 0, 0.85),
          inset 0 0 25px rgba(212, 175, 55, 0.08);

        backdrop-filter: blur(6px);

        position: absolute;
      }

      #startup-screen {
        position: absolute;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: #030508;

        z-index: 50;

        display: flex;

        justify-content: center;
        align-items: center;

        opacity: 0;

        pointer-events: none;

        transition: opacity 1.5s ease-in-out;
      }

      #startup-screen.show {
        opacity: 1;

        pointer-events: auto;
      }

      .voces-text {
        font-size: 90px;

        font-weight: 900;

        letter-spacing: 25px;

        color: #d4af37;

        text-shadow:
          0 0 40px rgba(212, 175, 55, 0.6),
          0 0 10px rgba(212, 175, 55, 0.8);

        animation: pulse 3s infinite alternate;
      }

      @keyframes pulse {
        from {
          transform: scale(0.95);

          opacity: 0.8;
        }

        to {
          transform: scale(1.05);

          opacity: 1;
        }
      }

      /* ================= SYSTEM WRAPPER ================= */

      #system-wrapper {
        position: absolute;

        top: 0;

        left: 0;

        width: 100%;

        height: 100%;

        z-index: 10;

        transition: all 1s ease;

        opacity: 0;

        filter: grayscale(100%) brightness(0.2);

        pointer-events: none;
      }

      #system-wrapper.online {
        opacity: 1;

        filter: grayscale(0%) brightness(1);

        pointer-events: auto;
      }

      /* ================= HAZARD RAY ================= */

      #hazard-ray {
        position: absolute;

        bottom: 0;

        left: 0;

        width: 100%;

        height: 40vh;

        background: linear-gradient(
          to top,

          rgba(255, 0, 0, 0.7),
          transparent
        );

        opacity: 0;

        transition: opacity 0.2s;

        z-index: 5;

        mix-blend-mode: screen;

        pointer-events: none;
      }

      #hazard-ray.active {
        opacity: 1;

        animation: strobe 0.3s infinite alternate;
      }

      @keyframes strobe {
        from {
          opacity: 0.2;
        }

        to {
          opacity: 1;
        }
      }

      /* ================= PANELS ================= */

      .panel {
        background: linear-gradient(
          135deg,
          rgba(5, 10, 15, 0.78),
          rgba(0, 5, 10, 0.85)
        );

        padding: 25px;

        border-radius: 16px;

        border: 1px solid rgba(212, 175, 55, 0.5);

        box-shadow:
          0 15px 50px rgba(0, 0, 0, 0.85),
          inset 0 0 25px rgba(212, 175, 55, 0.08);

        backdrop-filter: blur(8px);

        position: absolute;
      }

      /* ================= TELEMETRY PANEL ================= */

      .telemetry-panel {
        top: 30px;
        left: 30px;
        border-top: 4px solid #d4af37;
        width: 700px;
        min-height: 600px;
      }

      .panel-title {
        color: #d4af37;
        font-weight: 900;
        letter-spacing: 6px;
        margin-bottom: 35px;
        font-size: 38px;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        text-align: center;
      }

      /* ================= ICON BAR ================= */

      .icon-bar {
        display: flex;
        justify-content: space-around;
        background: rgba(0, 0, 0, 0.6);
        padding: 25px 15px;
        border-radius: 12px;
        margin-bottom: 35px;
      }

      .symbol-container {
        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 5px;
      }

      .symbol {
        width: 55px;
        height: 55px;
      }

      .icon-label {
        font-size: 11px;
        margin-top: 5px;
      }

      .symbol.off {
        stroke: #444;

        filter: none;
      }

      .symbol.yellow {
        stroke: #ffd700;

        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
      }

      .symbol.green {
        stroke: #3fb950;

        filter: drop-shadow(0 0 10px rgba(63, 185, 80, 0.8));
      }

      .symbol.red {
        stroke: #ff3333;

        filter: drop-shadow(0 0 10px rgba(255, 51, 51, 0.8));
      }

      .symbol.blink-red {
        animation: blinkRed 0.4s infinite alternate;
      }

      @keyframes blinkRed {
        from {
          stroke: #444;

          filter: none;
        }

        to {
          stroke: #ff3333;

          filter: drop-shadow(0 0 15px #ff3333);
        }
      }

      /* ================= METERS ================= */

      .meter-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }

      .meter {
        background: rgba(0, 0, 0, 0.75);
        padding: 30px 20px;
        min-height: 140px;
        border-radius: 12px;
        text-align: center;
        border-left: 4px solid #00f0ff;
        position: relative;
        overflow: hidden;
        box-shadow:
          inset 0 0 20px rgba(0, 0, 0, 0.9),
          0 5px 15px rgba(0, 0, 0, 0.5);

        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .meter.wireless {
        border-left: 3px solid #d4af37;
      }

      .value {
        font-size: 52px;
        font-weight: 900;
        color: #fff;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.5),
          0 0 20px rgba(255, 255, 255, 0.15);
      }

      .label {
        font-size: 14px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 12px;
      }

      /* ================= BATTERY ================= */

      .battery-panel {
        bottom: 30px;

        right: 30px;

        padding: 20px;

        border-top: 4px solid #d4af37;

        width: 340px;

        height: 260px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;
      }

      .batt-title {
        font-size: 16px;

        color: #d4af37;

        font-weight: bold;

        letter-spacing: 4px;

        margin-bottom: 20px;

        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }

      .battery-core {
        display: flex;

        flex-direction: column;

        align-items: center;
      }

      .battery-cap {
        width: 50px;

        height: 12px;

        background: #888;

        border-radius: 6px 6px 0 0;

        border: 2px solid #444;

        border-bottom: none;

        z-index: 2;
      }

      .battery-body {
        width: 120px;

        height: 180px;

        border: 4px solid #aaa;

        border-radius: 12px;

        position: relative;

        overflow: hidden;

        background: rgba(0, 0, 0, 0.8);

        box-shadow:
          inset 0 0 25px rgba(0, 0, 0, 1),
          0 0 20px rgba(212, 175, 55, 0.15);
      }

      .battery-liquid {
        position: absolute;

        bottom: 0;

        left: 0;

        width: 100%;

        height: 0%;

        background: linear-gradient(
          to top,

          #1e7e34,
          #3fb950
        );

        transition: height 1s ease-in-out;

        box-shadow: 0 0 25px rgba(63, 185, 80, 0.9);

        border-top: 2px solid #66ff77;
      }

      .battery-percentage {
        position: absolute;

        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

        font-size: 30px;

        font-weight: 900;

        color: white;

        z-index: 3;
      }

      /* ================= CONTROLS ================= */

      .controls-panel {
        position: absolute;

        top: 30px;

        right: 30px;

        z-index: 20;

        display: flex;

        flex-direction: column;

        align-items: flex-end;

        gap: 15px;
      }

      .engine-btn {
        background: rgba(10, 15, 20, 0.9);

        color: #d4af37;

        border: 2px solid #d4af37;

        padding: 20px 50px;

        font-size: 28px;

        font-family: "Orbitron", sans-serif;

        font-weight: 900;

        border-radius: 8px;

        cursor: pointer;

        text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);

        box-shadow:
          inset 0 0 20px rgba(212, 175, 55, 0.15),
          0 0 25px rgba(0, 0, 0, 0.9);

        transition: all 0.3s ease;

        text-transform: uppercase;
      }

      .engine-btn:hover {
        background: rgba(212, 175, 55, 0.15);
      }

      .engine-btn.running {
        color: #ff3333;

        border-color: #ff3333;

        text-shadow: 0 0 20px rgba(255, 51, 51, 0.8);

        box-shadow: inset 0 0 20px rgba(255, 51, 51, 0.2);
      }

      .status-box {
        background: rgba(0, 0, 0, 0.8);
        padding: 30px;
        margin-top: 30px;
        border-radius: 12px;
        border-right: 4px solid #ff3333;
        font-size: 30px;
        text-align: center;
      }

      .mode-box {
        background: rgba(0, 0, 0, 0.8);

        padding: 18px;

        width: 100%;

        border-radius: 10px;

        text-align: center;

        font-size: 24px;

        font-weight: 700;

        border-bottom: 3px solid #555;

        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* ================= MOBILE ================= */

      @media (max-width: 900px) {
        body,
        html {
          overflow-y: auto;
        }

        .telemetry-panel {
          width: calc(100% - 40px);

          left: 20px;

          top: 20px;
        }

        .controls-panel {
          top: auto;

          bottom: 20px;

          right: 20px;
        }

        .battery-panel {
          display: none;
        }

        .engine-btn {
          font-size: 18px;

          padding: 15px 25px;
        }

        .voces-text {
          font-size: 45px;

          letter-spacing: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="background-overlay"></div>

    <!-- STARTUP SCREEN -->

    <div id="startup-screen">
      <div class="voces-text">Truck Starting...</div>
    </div>

    <!-- HAZARD EFFECT -->

    <div id="hazard-ray"></div>

    <!-- CONTROLS -->

    <div class="controls-panel">
      <button id="engineBtn" class="engine-btn" onclick="toggleEngine()">
        SYSTEM START
      </button>

      <div class="mode-box">
        MODE:

        <span id="mode-text" style="color: #555"> STANDBY </span>
      </div>
    </div>

    <!-- MAIN DASHBOARD -->

    <div id="system-wrapper">
      <!-- TELEMETRY PANEL -->

      <div class="panel telemetry-panel">
        <div class="panel-title">Readings</div>

        <!-- ICON BAR -->

        <div class="icon-bar">
          <!-- AMT -->

          <div class="symbol-container">
            <svg id="icon-amt" class="symbol off" viewBox="0 0 100 100">
              <path
                d="M50 15 L50 25 M85 50 L75 50 M50 85 L50 75 M15 50 L25 50"
                stroke-width="4"
              />

              <circle
                cx="50"
                cy="50"
                r="30"
                stroke-dasharray="10 5"
                stroke-width="6"
              />

              <circle
                cx="50"
                cy="50"
                r="15"
                fill="currentColor"
                stroke="none"
                opacity="0.3"
              />
            </svg>

            <div class="icon-label">AMT</div>
          </div>

          <!-- ABS -->

          <div class="symbol-container">
            <svg id="icon-abs" class="symbol off" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="35" />

              <path
                d="M20 50 A 40 40 0 0 1 20 20 M80 50 A 40 40 0 0 0 80 20"
                stroke-width="4"
              />

              <text
                x="50"
                y="56"
                font-family="Arial"
                font-size="22"
                font-weight="bold"
                fill="currentColor"
                stroke="none"
                text-anchor="middle"
              >
                ABS
              </text>
            </svg>

            <div class="icon-label">BRAKE</div>
          </div>

          <!-- SOLAR -->

          <div class="symbol-container">
            <svg id="icon-sol" class="symbol off" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" />

              <path
                d="M25 40 L75 40 M25 60 L75 60 M40 25 L40 75 M60 25 L60 75"
              />

              <path
                d="M70 20 Q80 30 70 40 M80 15 Q95 30 80 45"
                stroke-width="3"
              />
            </svg>

            <div class="icon-label">SOLAR</div>
          </div>

          <!-- WIRELESS -->

          <div class="symbol-container">
            <svg id="icon-wl" class="symbol off" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" />

              <path
                d="M30 50 A 20 20 0 0 1 70 50 M20 50 A 30 30 0 0 1 80 50"
                stroke-dasharray="4 4"
              />

              <rect x="40" y="35" width="20" height="30" rx="3" />

              <path d="M47 50 L50 55 L53 45 L50 50" stroke-width="2" />
            </svg>

            <div class="icon-label">INDUCT</div>
          </div>

          <!-- COLLISION -->

          <div class="symbol-container">
            <svg id="icon-col" class="symbol off" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" />

              <path d="M25 55 L40 55 L45 45 L30 45 Z" />

              <path d="M75 55 L60 55 L55 45 L70 45 Z" />

              <path d="M50 25 L50 45 M50 65 L50 75" stroke-width="4" />
            </svg>

            <div class="icon-label">RADAR</div>
          </div>

          <!-- TEMPERATURE -->

          <div class="symbol-container">
            <svg id="icon-temp" class="symbol off" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" />

              <path d="M50 25 L50 65" stroke-width="6" stroke-linecap="round" />

              <circle cx="50" cy="70" r="8" fill="currentColor" stroke="none" />
            </svg>

            <div class="icon-label">TEMP</div>
          </div>
        </div>

        <!-- METERS -->

        <div class="meter-grid">
          <div class="meter">
            <div class="value" id="sol_v">0.0</div>

            <div class="label">Solar Voltage</div>
          </div>

          <div class="meter">
            <div class="value" id="sol_w">0</div>

            <div class="label">Solar Watts</div>
          </div>

          <div class="meter wireless">
            <div class="value" id="wl_v">0.0</div>

            <div class="label">Inductive Volts</div>
          </div>

          <div class="meter wireless">
            <div class="value" id="wl_w">0</div>

            <div class="label">Inductive Watts</div>
          </div>
        </div>

        <!-- RADAR -->

        <div class="status-box">
          FWD RADAR:

          <span id="dist-val" style="color: #ff3333; font-weight: 900">
            0
          </span>

          cm
        </div>
      </div>

      <!-- BATTERY PANEL -->

      <div class="panel battery-panel">
        <div class="batt-title">ENERGY RESERVE</div>

        <div class="battery-core">
          <div class="battery-cap"></div>

          <div class="battery-body">
            <div class="battery-liquid" id="bat-liquid"></div>

            <div class="battery-percentage">
              <span id="bat-text"> 0 </span>

              %
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ================= SYSTEM VARIABLES ================= */

      let engineRunning = false;

      let systemChecking = false;

      let engineStartTime = 0;

      /* ================= START / SHUTDOWN ================= */

      function toggleEngine() {
        const btn = document.getElementById("engineBtn");

        const wrapper = document.getElementById("system-wrapper");

        const vocesScreen = document.getElementById("startup-screen");

        if (!engineRunning) {
          engineRunning = true;

          systemChecking = true;

          engineStartTime = Date.now();

          btn.innerText = "SYSTEM SHUTDOWN";

          btn.classList.add("running");

          /* SHOW VOCES STARTUP */

          vocesScreen.classList.add("show");

          setTimeout(() => {
            vocesScreen.classList.remove("show");

            wrapper.classList.add("online");

            /* STARTUP ICON CHECK */

            const allIcons = document.querySelectorAll(".symbol");

            allIcons.forEach((el) => {
              el.setAttribute(
                "class",

                "symbol yellow",
              );
            });

            setTimeout(() => {
              systemChecking = false;
            }, 1000);
          }, 3000);
        } else {
          engineRunning = false;

          btn.innerText = "SYSTEM START";

          btn.classList.remove("running");

          wrapper.classList.remove("online");

          /* RESET MODE */

          document.getElementById("mode-text").innerText = "STANDBY";

          document.getElementById("mode-text").style.color = "#555";

          /* RESET ICONS */

          document

            .querySelectorAll(".symbol")

            .forEach((el) => {
              el.setAttribute(
                "class",

                "symbol off",
              );
            });

          /* RESET HAZARD */

          document

            .getElementById("hazard-ray")

            .classList.remove("active");

          /* RESET BATTERY */

          document.getElementById("bat-liquid").style.height = "0%";

          document.getElementById("bat-text").innerText = "0";

          /* RESET VALUES */

          document.getElementById("sol_v").innerText = "0.0";

          document.getElementById("sol_w").innerText = "0";

          document.getElementById("wl_v").innerText = "0.0";

          document.getElementById("wl_w").innerText = "0";

          document.getElementById("dist-val").innerText = "0";
        }
      }

      /* ================= DEMO DATA ================= */

      function updateDashboardDemo() {
        if (!engineRunning) return;

        const elapsed = (Date.now() - engineStartTime) / 1000;

        /*
        SIMULATED VALUES

        This replaces ESP32 fetch('/data').

        Values change smoothly so the dashboard
        works as a standalone GitHub website.
      */

        const solVolt = 5.8 + Math.sin(elapsed / 5) * 0.5;

        const solWatts = Math.max(
          0,

          28 + Math.sin(elapsed / 4) * 6,
        );

        const wlVolt = 7.2 + Math.sin(elapsed / 3) * 0.8;

        const wlWatts = Math.max(
          0,

          42 + Math.cos(elapsed / 4) * 8,
        );

        const batPercent = Math.min(
          100,

          Math.max(
            35,

            Math.round(76 + Math.sin(elapsed / 12) * 3),
          ),
        );

        const dist = Math.round(8 + Math.sin(elapsed / 2) * 5);

        /* UPDATE SOLAR */

        document.getElementById("sol_v").innerText = solVolt.toFixed(1);

        document.getElementById("sol_w").innerText = solWatts.toFixed(0);

        /* UPDATE WIRELESS */

        document.getElementById("wl_v").innerText = wlVolt.toFixed(1);

        document.getElementById("wl_w").innerText = wlWatts.toFixed(0);

        /* UPDATE RADAR */

        document.getElementById("dist-val").innerText = Math.max(1, dist);

        /* UPDATE BATTERY */

        document.getElementById("bat-liquid").style.height = batPercent + "%";

        document.getElementById("bat-text").innerText = batPercent;

        /* UPDATE MODE */

        const modeSpan = document.getElementById("mode-text");

        if (solVolt >= 3.0 || wlVolt >= 3.0) {
          modeSpan.innerText = "CHARGING";

          modeSpan.style.color = "#00f0ff";
        } else {
          modeSpan.innerText = "BATTERY";

          modeSpan.style.color = "#d4af37";
        }

        /* ================= ICON STATUS ================= */

        if (!systemChecking) {
          document

            .getElementById("icon-amt")

            .setAttribute(
              "class",

              "symbol green",
            );

          document

            .getElementById("icon-abs")

            .setAttribute(
              "class",

              "symbol red",
            );

          /* SOLAR STATUS */

          document

            .getElementById("icon-sol")

            .setAttribute(
              "class",

              solVolt >= 3.0 ? "symbol green" : "symbol red",
            );

          /* WIRELESS STATUS */

          document

            .getElementById("icon-wl")

            .setAttribute(
              "class",

              wlVolt >= 1.0 ? "symbol green" : "symbol red",
            );

          /* COLLISION RADAR */

          const ray = document.getElementById("hazard-ray");

          if (dist < 3 && dist > 0) {
            document

              .getElementById("icon-col")

              .setAttribute(
                "class",

                "symbol blink-red",
              );

            ray.classList.add("active");
          } else {
            document

              .getElementById("icon-col")

              .setAttribute(
                "class",

                "symbol off",
              );

            ray.classList.remove("active");
          }

          /* TEMPERATURE SYSTEM */

          if (Date.now() - engineStartTime > 300000) {
            document

              .getElementById("icon-temp")

              .setAttribute(
                "class",

                "symbol blink-red",
              );
          } else {
            document

              .getElementById("icon-temp")

              .setAttribute(
                "class",

                "symbol off",
              );
          }
        }
      }

      /* ================= LIVE UPDATE ================= */

      setInterval(
        updateDashboardDemo,

        500,
      );
    </script>
  </body>
</html>
